
name: Bons Plans Instant Gaming

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bons-plans
  cancel-in-progress: false

jobs:
  bons-plans:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer les fichiers
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Lancer le bot
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          APIFY_TASK_ID: ${{ secrets.APIFY_TASK_ID }}
          APIFY_RUN_ID: ${{ secrets.APIFY_RUN_ID }}
        run: python bot.py

      - name: Sauvegarder les jeux publies
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sent_offers.json
          if ! git diff --staged --quiet; then
            git commit -m "Sauvegarde des bons plans"
            git push
          fi
